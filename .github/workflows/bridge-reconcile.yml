name: bridge reconcile (GOV + OPS)

# Polices this repository's issues against the union of the projects mapped
# here. A red run is the alarm.
on:
  issues:
    types: [opened, reopened, edited, closed]
  repository_dispatch:
    types: [bridge-reconcile]
  workflow_run:
    workflows: ["bridge scaffold (GOV + OPS)"]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: bridge-reconcile
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  reconcile:
    if: (github.event_name != 'issues' || github.actor != 'github-actions[bot]') && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: c4g-john/docassert-action/install@v1
      - name: Reconcile (union of GOV and OPS)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          docassert bridge reconcile --repo "$GITHUB_REPOSITORY"
